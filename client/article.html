<!DOCTYPE html>
<html>
<head>
  <title id="meta-title">News Article</title>
  <meta name="description" id="meta-description" content="" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<script type="application/ld+json" id="schema"></script>
<script async
  src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js">
</script>

<body>

<header class="brand-header">
  <img src="/assets/logo.png" alt="S సంగారెడ్డి NEWS Logo" />
  <h1> సంగారెడ్డి <span>NEWS</span></h1>
</header>


<div class="container">

  <div class="article-surface">

    <div class="article-hero">
      <img id="article-image" />
    </div>

    <p id="sponsored-label" style="color:#c00;font-weight:bold"></p>
    <h1 id="title"></h1>
    <p id="date"></p>

    <div id="author-box"></div>

    <div id="article-body">
      <p id="content"></p>
    </div>

    <div id="sponsored-ad-slot"></div>
    <div id="video-container" style="margin:40px 0;"></div>
    <div id="ad-slot-article"></div>

    <br />
    <a href="/">← Back to News</a>

  </div>

</div>

<!-- Google Ad (Network) -->
<div id="google-ad-slot"></div>


<div class="engagement-bar">
  <div class="engagement-left">
    <span id="like-btn" class="like-pill">
      <i class="fa-regular fa-heart"></i>
      <span id="like-count">0</span>
    </span>

  </div>

  <div class="engagement-right">
    <span>Share:</span>
    <a id="wa-share" title="WhatsApp">
      <i class="fa-brands fa-whatsapp"></i>
    </a>
    <a id="fb-share" title="Facebook">
      <i class="fa-brands fa-facebook"></i>
    </a>
    <a id="tw-share" title="X">
      <i class="fa-brands fa-x-twitter"></i>
    </a>
  </div>

</div>



<hr />

<div class="comments-section">
  <h3>Discussion</h3>

  <div class="comment-form">
    <input id="comment-name" placeholder="Name" />
    <textarea id="comment-text" placeholder="Add your comment"></textarea>
    <button id="comment-btn">Post</button>
  </div>

  <div id="comments"></div>
</div>




<footer class="site-footer">
  © Sangareddy News
</footer>


<script src="js/main.js"></script>
</body>
</html>
