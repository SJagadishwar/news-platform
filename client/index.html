<!DOCTYPE html>
<html>
<head>
  <title>Reporter News Platform</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml">
</head>
<body>

<header class="brand-header">
  <img src="/assets/logo.png" alt="S సంగారెడ్డి NEWS Logo" />
  <h1> సంగారెడ్డి <span>NEWS</span></h1>
</header>


<div class="container">

  <div class="breaking">
    <span class="live-dot"></span>
    <span class="breaking-label">BREAKING</span>
    <span id="breaking-text" class="breaking-text">
      Loading breaking news…
    </span>
  </div>



  <div id="lead-story"></div>

  <div id="news-list"></div>

  <div id="trending">
    <h3>🔥 Most Read</h3>
    <div id="trending-list"></div>
  </div>


</div>

<div class="container">
  <div id="ad-slot-home"></div>
</div>



<footer class="site-footer">
  © Sangareddy News
</footer>


<script src="js/main.js"></script>
</body>
</html>
