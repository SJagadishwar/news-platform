<!DOCTYPE html>
<html>

<head>
  <title>Admin Login</title>
  <!-- Premium Fonts Test Pack -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#b30000">
  <link rel="stylesheet" href="/css/style.css?v=4" />
</head>

<body class="login-page">

<header class="brand-header">
  <img src="/assets/logo.png" alt="S సంగారెడ్డి NEWS Logo" />
  <h1> సంగారెడ్డి <span>NEWS</span></h1>
</header>


<div class="container">

  <div class="admin-card">
    <h2>Reporter Login</h2>

    <input id="email" type="email" placeholder="Enter admin email" />

    <div id="otp-section" style="display:none;">
      <input id="otp" placeholder="Enter OTP" />
    </div>

    <button id="send-otp-btn" onclick="sendOtp()">Send OTP</button>
    <button id="verify-otp-btn" onclick="verifyOtp()" style="display:none;">
      Verify OTP
    </button>
    
    <p id="status"></p>
  
  </div>

</div>

<script src="/js/login.js"></script>
</body>


</html>
