<!DOCTYPE html>
<html>

<head>
  <title>Admin Login</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body class="login-page">

<header class="brand-header">
  <img src="/assets/logo.png" alt="S సంగారెడ్డి NEWS Logo" />
  <h1> సంగారెడ్డి <span>NEWS</span></h1>
</header>


<div class="container">

  <div class="admin-card">
    <h2>Reporter Login</h2>

    <input id="email" type="email" placeholder="Enter admin email" />

    <div id="otp-section" style="display:none;">
      <input id="otp" placeholder="Enter OTP" />
    </div>

    <button id="send-otp-btn" onclick="sendOtp()">Send OTP</button>
    <button id="verify-otp-btn" onclick="verifyOtp()" style="display:none;">
      Verify OTP
    </button>
    
    <p id="status"></p>
  
  </div>

</div>

<script src="/js/login.js"></script>
</body>


</html>
